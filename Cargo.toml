[workspace]
resolver = "2"
members = [
    "crates/malverde-core",
    "crates/malverde-provider",
    "crates/malverde-tools",
    "crates/malverde-memory",
    "crates/malverde-skills",
    "crates/malverde-agent",
    "crates/malverde-scheduler",
    "crates/malverde-gateway",
    "crates/malverde-cli",
    "crates/malverde-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["wero"]
license = "MIT"
[workspace.dependencies]
malverde-core = { path = "crates/malverde-core" }
malverde-provider = { path = "crates/malverde-provider" }
malverde-tools = { path = "crates/malverde-tools" }
malverde-memory = { path = "crates/malverde-memory" }
malverde-skills = { path = "crates/malverde-skills" }
malverde-agent = { path = "crates/malverde-agent" }
malverde-scheduler = { path = "crates/malverde-scheduler" }
malverde-gateway = { path = "crates/malverde-gateway" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.30", features = ["bundled"] }
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.27"
ratatui = "0.26"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.10", features = ["json"] }
tiny_http = "0.12"

[profile.release]
opt-level = 2
lto = "thin"
