[package]
name = "malverde-cli"
version = "0.1.0"
edition = "2021"
authors = ["wero"]
description = "Command-line interface for Malverde Core Framework"
license = "MIT"

[dependencies]
malverde-core = { path = "../malverde-core" }
malverde-config = { path = "../malverde-config" }
malverde-job = { path = "../malverde-job" }
malverde-events = { path = "../malverde-events" }
malverde-audit = { path = "../malverde-audit" }
malverde-storage = { path = "../malverde-storage" }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
