[package]
name = "malverde-storage"
version = "0.1.0"
edition = "2021"
description = "SQLite + FTS5 storage module for Malverde framework."

[dependencies]
malverde-core = { path = "../malverde-core" }
rusqlite = { version = "0.30", features = ["bundled", "fts5"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }