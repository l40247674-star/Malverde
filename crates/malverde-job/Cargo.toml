[package]
name = "malverde-job"
version = "0.1.0"
edition = "2021"
authors = ["wero"]
description = "Job system for Malverde Core Framework"
license = "MIT"

[dependencies]
malverde-core = { path = "../malverde-core" }
malverde-storage = { path = "../malverde-storage" }
malverde-events = { path = "../malverde-events" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
