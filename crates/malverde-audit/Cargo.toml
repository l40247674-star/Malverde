[package]
name = "malverde-audit"
version = "0.1.0"
edition = "2021"
authors = ["wero"]
description = "Audit logging system for Malverde Core Framework"
license = "MIT"

[dependencies]
malverde-core = { path = "../malverde-core" }
malverde-storage = { path = "../malverde-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
