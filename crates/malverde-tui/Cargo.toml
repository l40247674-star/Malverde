[package]
name = "malverde-tui"
version = "0.1.0"
edition = "2021"
authors = ["wero"]
description = "Terminal UI for Malverde Core Framework"
license = "MIT"

[dependencies]
malverde-core = { path = "../malverde-core" }
malverde-config = { path = "../malverde-config" }
malverde-job = { path = "../malverde-job" }
malverde-events = { path = "../malverde-events" }
malverde-audit = { path = "../malverde-audit" }
ratatui = "0.25"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
