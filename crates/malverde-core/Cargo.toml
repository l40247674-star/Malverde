[package]
name = "malverde-core"
version = "0.1.0"
edition = "2021"
description = "Core module for Malverde framework: types, config, errors, logging."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }